version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8000:80"
      - "4430:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - webroot:/var/www/html
    networks: [app-net]

  api-gateway:
    build: ../apps/api-gateway
    container_name: api-gateway
    restart: always
    env_file:
      - path: ../apps/api-gateway/.env.example
    networks: [app-net]

  frontend:
    build: ../apps/frontend
    container_name: frontend
    restart: always
    env_file:
      - path: ../apps/frontend/.env.example
    networks: [app-net]

  auth:
    build: ../apps/auth
    container_name: auth
    restart: always
    env_file:
      - path: ../apps/auth/.env.example
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://auth:8081/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    networks:
      - app-net
      - auth-net

  auth_db:
    image: postgres:15
    container_name: auth_db
    environment:
      POSTGRES_USER: yassir
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: auth_db
    restart: always
    volumes:
      - auth_db_volume:/var/lib/postgresql/data
    networks: [auth-net]

  notification:
    build: ../apps/notification
    container_name: notification
    restart: always
    env_file:
      - path: ../apps/notification/.env.example
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://notification:8082/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    networks:
      - app-net

  slots:
    build: ../apps/slots
    container_name: slots
    restart: always
    env_file: ../apps/slots/.env.example
    networks:
      - app-net
      - slots-net

  slots_db:
    image: postgres:15
    container_name: slots_db
    restart: always
    environment:
      POSTGRES_USER: yassir
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest_db
    volumes:
      - slots_db_volume:/var/lib/postgresql/data
    networks: [slots-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: yassir
      RABBITMQ_DEFAULT_PASS: yassir123
    networks: [app-net]

networks:
  app-net:
    driver: bridge
  auth-net:
    driver: bridge
  slots-net:
    driver: bridge

volumes:
  auth_db_volume:
  slots_db_volume:
  webroot:
