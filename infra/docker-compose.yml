version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - webroot:/var/www/html
    networks: [app-net]

  api-gateway:
    build: ../apps/api-gateway
    container_name: api-gateway
    restart: always
    env_file:
      - path: ../apps/api-gateway/.env.example
  #  ports: ["${PORT:-8080}:${PORT:-8080}"]
    networks: [app-net]

  frontend:
    build: ../apps/frontend
    container_name: frontend
    restart: always
    env_file:
      - path: ../apps/frontend/.env.example
    networks: [app-net]

  auth:
    build: ../apps/auth
    container_name: auth
    restart: always
    env_file:
      - path: ../apps/auth/.env.example
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://auth:8081/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    networks:
      - app-net
      - auth-net

  auth_db:
    image: postgres:15
    container_name: auth_db
    env_file: ../apps/auth/.env.example
    restart: always
    volumes:
      - auth_db_volume:/var/lib/postgresql/data
    networks: [auth-net]

  notification:
    build: ../apps/notification
    container_name: notification
    restart: always
    env_file:
      - path: ../apps/notification/.env.example
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://notification:8082/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    networks:
      - app-net
      - notification-net

  notification_db:
    image: postgres:15
    container_name: notification_db
    environment:
      POSTGRES_USER: yassir
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: notification_db
    volumes:
      - notification_db_volume:/var/lib/postgresql/data
    networks: [notification-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: yassir
      RABBITMQ_DEFAULT_PASS: yassir123
    networks: [app-net]

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/html
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/html --email hassanbenydir26@gmail.com --agree-tos --no-eff-email --non-interactive --keep-until-expiring -d 7host
    networks: [app-net]

networks:
  app-net:
    driver: bridge
  notification-net:
    driver: bridge
  auth-net:
    driver: bridge

volumes:
  auth_db_volume:
  notification_db_volume:
  webroot:
  certbot-etc:
  certbot-var:
