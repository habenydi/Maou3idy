on:
  # 'pull_request':
  #   branches:
  #     - main
  #     - development
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: 
          node_version: '22'
      
      - name: lint auth service
        run:  cd apps/auth && npm install && npm run lint
      - name: lint front-end
        run: cd apps/frontend && npm install && npm run lint
      - name: lint slots service
        run: cd apps/slots && npm install && npm run lint
      - name: lint notification service
        run: cd apps/notification && npm install && npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node_version: '22'

      - name: set environment
        run: make env
      - name: build images
        run: make build

