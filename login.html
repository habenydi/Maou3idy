<html class="light" lang="en"><head>

                        "tertiary": "#a63b00",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>

<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-6 overflow-x-hidden">
<!-- Ambient Background Decorations -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[35%] h-[35%] rounded-full bg-secondary/5 blur-[100px]"></div>
<div class="absolute top-[20%] right-[15%] w-[100px] h-[100px] rounded-full bg-tertiary-fixed blur-[60px] opacity-20"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[480px]">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-10">
<div class="mb-4 flex items-center justify-center w-12 h-12 rounded-xl bg-primary-container shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-2xl" data-icon="medical_services">medical_services</span>
</div>
<h1 class="font-headline text-2xl font-extrabold tracking-tighter text-on-surface">
                MedReserve
            </h1>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-xl shadow-[0_12px_40px_rgba(0,87,206,0.06)] p-8 md:p-12">
<header class="mb-8 text-center">
<h2 class="font-headline text-3xl font-bold text-on-surface tracking-tight mb-2">Welcome Back</h2>
<p class="text-on-surface-variant text-sm font-medium">Please enter your credentials to access your clinical dashboard.</p>
</header>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-on-surface uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 outline-none font-medium" id="email" name="email" placeholder="dr.wilson@medreserve.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-xs font-semibold text-on-surface uppercase tracking-wider" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 outline-none font-medium" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-low" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 text-sm font-medium text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Action Button -->
<button class="w-full py-4 px-6 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-xl shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Action -->
<div class="mt-8 text-center">
<button class="text-sm font-medium text-on-surface-variant">
                    Don't have an account? 
                    <span class="text-primary font-bold hover:underline underline-offset-4 decoration-primary/30 ml-1">Sign Up</span>
</button>
</div>
</div>
<!-- Footer -->
<footer class="mt-12">
<div class="flex flex-wrap justify-center gap-6 mb-6">
<a class="text-xs font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-xs font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-xs font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
<p class="text-center text-[10px] text-outline font-medium tracking-wide uppercase">
                © 2024 MedReserve Clinical Systems. All rights reserved.
            </p>
</footer>
</main>
<!-- Contextual Aesthetic Element (Asymmetric Detail) -->
<div class="hidden lg:block fixed top-1/2 -right-24 -translate-y-1/2 w-64 h-96 opacity-10">
