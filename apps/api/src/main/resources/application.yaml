spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:1337
              predicates:
                - Path=/auth/**,/users/**,/admin/**,/doctor/**

            - id: appointment-service
              uri: http://localhost:1339
              predicates:
                - Path=/slots/**,/categories/**, /services/**