spring:
  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            - id: auth-service
              uri: http://localhost:1337
              predicates:
                - Path=/auth/**,/users/**,/admin/**,/doctor/**,/notification/**,/review/**

            - id: appointment-service
              uri: http://localhost:1339
              predicates:
                - Path=/slots/**,/categories/**,/services/**