server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${NGINX_URL:http://nginx:80}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            - id: auth-service
              # Defaults keep native (non-Docker) dev working as before;
              # docker-compose overrides these via env vars to the service's
              # container name, since "localhost" inside this container
              # would otherwise mean itself, not the auth container.
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**,/users/**,/admin/**,/doctor/**,/notification/**,/review/**,/user-stats/**

            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/slots/**,/categories/**,/services/**