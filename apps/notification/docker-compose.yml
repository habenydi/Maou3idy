services:
  notification_db:
    image: postgres:15
    container_name: notification_db
    environment:
      POSTGRES_USER: yassir
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: notification_db
    ports:
      - "5433:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

volumes:
  notification_postgres_data: